<!DOCTYPE html>
<html>
<head>
    <title>Offence Management</title>
</head>
<body>
    <h1>ChallanTrack - Offence Management</h1>

    <h2>Add New Offence</h2>

    <form method="POST">
        <input type="text" name="offence_name"
               placeholder="Offence Name" required>

        <input type="number" name="fine_amount"
               placeholder="Fine Amount" required>

        <button type="submit">Add Offence</button>
    </form>

    <h2>Available Offences</h2>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Offence</th>
            <th>Fine Amount</th>
        </tr>
    </table>

</body>
</html>
