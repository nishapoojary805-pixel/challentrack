<body>

<header>
    <h1>🚦 ChallanTrack</h1>
    <p>Traffic Violation and Penalty Management System</p>
</header>

<div class="container">

    <h2>Issue New Challan</h2>

    <form method="POST" action="/issue_challan">

        <!-- Vehicle Number -->
        <label>Vehicle Number:</label>

        <input
            type="text"
            name="vehicle_number"
            placeholder="Example: KA01AB1234"
            required
        >

        <!-- Owner Name -->
        <label>Owner Name:</label>

        <input
            type="text"
            name="owner_name"
            placeholder="Enter Vehicle Owner Name"
            required
        >

        <!-- Select Offence -->
        <label>Select Offence:</label>

        <select name="offence_id" required>

            <option value="">-- Select Offence --</option>

            {% for offence in offences %}

            <option value="{{ offence['id'] }}">
                {{ offence['offence_name'] }}
                - ₹{{ offence['fine_amount'] }}
            </option>

            {% endfor %}

        </select>

        <!-- Location -->
        <label>Location:</label>

        <input
            type="text"
            name="location"
            id="location"
            placeholder="Enter Violation Location"
            required
        >

        <!-- Current Location Button -->
        <button
            type="button"
            class="location-btn"
            onclick="getCurrentLocation()"
        >
            📍 Use Current Location
        </button>

        <p id="location_status"></p>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn">
            Generate Challan
        </button>

    </form>

    <a href="/dashboard" class="back">
        ← Back to Dashboard
    </a>

</div>

<footer>
    © 2026 ChallanTrack |
    Smart City Traffic Management System
</footer>

<script>

async function getCurrentLocation() {

    const locationInput = document.getElementById("location");
    const status = document.getElementById("location_status");

    if (!navigator.geolocation) {
        status.innerHTML = "❌ Geolocation is not supported.";
        return;
    }

    status.innerHTML = "📍 Detecting your current location...";

    navigator.geolocation.getCurrentPosition(

        async function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            status.innerHTML = "Finding your nearest area...";

            try {

                const url =
                    `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`;

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Location lookup failed");
                }

                const data = await response.json();
                const address = data.address || {};

                // Find the nearest available neighbourhood
                const area =
                    address.neighbourhood ||
                    address.suburb ||
                    address.residential ||
                    address.quarter ||
                    address.hamlet ||
                    address.village ||
                    address.town ||
                    address.city ||
                    "";

                const city =
                    address.city ||
                    address.town ||
                    address.village ||
                    address.municipality ||
                    "";

                const state = address.state || "";

                // Remove duplicate names
                const parts = [...new Set(
                    [area, city, state].filter(Boolean)
                )];

                if (parts.length > 0) {

                    locationInput.value = parts.join(", ");

                    status.innerHTML =
                        "✅ Nearby location detected successfully!";

                } else {

                    throw new Error("Area name not found");

                }

            } catch (error) {

                locationInput.value =
                    "Latitude: " + latitude.toFixed(6) +
                    ", Longitude: " + longitude.toFixed(6);

                status.innerHTML =
                    "⚠️ Area name unavailable. Coordinates displayed instead.";

            }

        },

        function(error) {

            if (error.code === error.PERMISSION_DENIED) {
                status.innerHTML =
                    "❌ Please allow location permission in your browser.";
            }
            else if (error.code === error.TIMEOUT) {
                status.innerHTML =
                    "❌ Location request timed out. Try again.";
            }
            else {
                status.innerHTML =
                    "❌ Unable to detect your current location.";
            }

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );

}

</script>

</body>
